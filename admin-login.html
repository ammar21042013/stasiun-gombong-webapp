<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin - Stasiun Gombong</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1464f4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
    }

    .success {
      background: #e7f7ed;
      color: #16743a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1464f4;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      <img src="icon-192.png" alt="Stasiun Gombong">
    </div>

    <h1>Login Admin</h1>

    <div class="subtitle">
      Stasiun Kelas 1 Gombong
    </div>

    <form id="loginForm">

      <label for="email">Email Admin</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email admin"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
      >

      <button type="submit" id="loginButton">
        Masuk
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
      ← Kembali ke Website
    </a>

  </div>

  <!-- Firebase Configuration -->
  <script src="firebase-config.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
      message.style.display = "block";
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Memeriksa...";

      message.style.display = "none";

      try {

        // Login menggunakan Firebase Authentication
        const userCredential =
          await auth.signInWithEmailAndPassword(email, password);

        const user = userCredential.user;

        // Periksa apakah UID terdaftar sebagai admin
        const adminDoc =
          await db.collection("admins").doc(user.uid).get();

        if (!adminDoc.exists) {

          await auth.signOut();

          throw new Error(
            "Akun berhasil login, tetapi akun tersebut bukan admin."
          );
        }

        const adminData = adminDoc.data();

        if (adminData.role !== "admin") {

          await auth.signOut();

          throw new Error(
            "Akun ini tidak memiliki hak akses administrator."
          );
        }

        showMessage(
          "Login berhasil. Membuka dashboard...",
          "success"
        );

        setTimeout(function() {
          window.location.href = "admin.html";
        }, 1000);

      } catch (error) {

        console.error(error);

        let errorMessage = "Login gagal.";

        if (error.code === "auth/invalid-credential") {
          errorMessage =
            "Email atau password tidak benar.";
        } else if (error.code === "auth/invalid-email") {
          errorMessage =
            "Format email tidak valid.";
        } else if (error.message) {
          errorMessage = error.message;
        }

        showMessage(errorMessage, "error");

        loginButton.disabled = false;
        loginButton.textContent = "Masuk";
      }
    });
  </script>

</body>
</html>
