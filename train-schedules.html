<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelola Jadwal Kereta - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #1464f4;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #1464f4;
      color: white;
    }

    .secondary {
      background: #e9edf2;
      color: #222;
    }

    .danger {
      background: #d93025;
      color: white;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .form-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
    }

    #formCard {
      display: none;
    }

    .schedule {
      border: 1px solid #e1e5e9;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .schedule-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .schedule h3 {
      margin: 0 0 5px;
    }

    .schedule p {
      margin: 5px 0;
      color: #666;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 50px;
    }

    #page {
      display: none;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      background: #e7f7ed;
      color: #16743a;
    }

    .inactive {
      background: #ffe8e8;
      color: #b00020;
    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    Memeriksa akses admin...
  </div>

  <div id="page">

    <header class="header">
      <div class="header-content">
        <h1>Kelola Jadwal Kereta</h1>
        <p>Stasiun Kelas 1 Gombong</p>
      </div>
    </header>

    <main class="container">

      <div class="topbar">
        <button
          class="secondary"
          onclick="window.location.href='admin.html'">
          ← Dashboard
        </button>

        <button
          class="primary"
          onclick="showAddForm()">
          + Tambah Jadwal
        </button>
      </div>

      <div id="formCard" class="card">

        <h2 id="formTitle">Tambah Jadwal</h2>

        <form id="scheduleForm">

          <div class="form-grid">

            <div>
              <label>Nama Kereta</label>
              <input id="trainName" required>
            </div>

            <div>
              <label>Nomor Kereta</label>
              <input id="trainNumber">
            </div>

            <div>
              <label>Tujuan</label>
              <input id="destination" required>
            </div>

            <div>
              <label>Keberangkatan</label>
              <input id="departure" type="time" required>
            </div>

            <div>
              <label>Kedatangan</label>
              <input id="arrival" type="time">
            </div>

            <div>
              <label>Status</label>
              <select id="status">
                <option value="Beroperasi">Beroperasi</option>
                <option value="Berubah">Berubah</option>
                <option value="Dibatalkan">Dibatalkan</option>
              </select>
            </div>

            <div>
              <label>Aktif</label>
              <select id="active">
                <option value="true">Ya</option>
                <option value="false">Tidak</option>
              </select>
            </div>

          </div>

          <div class="form-actions">

            <button
              type="submit"
              class="primary">
              Simpan
            </button>

            <button
              type="button"
              class="secondary"
              onclick="hideForm()">
              Batal
            </button>

          </div>

        </form>

      </div>

      <div class="card">

        <h2>Daftar Jadwal</h2>

        <div id="scheduleList">
          Memuat jadwal...
        </div>

      </div>

    </main>

  </div>

  <script src="firebase-config.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    let editingId = null;

    auth.onAuthStateChanged(async function(user) {

      if (!user) {
        window.location.href = "admin-login.html";
        return;
      }

      try {

        const adminDoc =
          await db.collection("admins")
          .doc(user.uid)
          .get();

        if (!adminDoc.exists ||
            adminDoc.data().role !== "admin") {

          await auth.signOut();

          window.location.href = "admin-login.html";

          return;
        }

        document.getElementById("loading").style.display = "none";
        document.getElementById("page").style.display = "block";

        loadSchedules();

      } catch (error) {

        console.error(error);

        await auth.signOut();

        window.location.href = "admin-login.html";

      }

    });

    async function loadSchedules() {

      const list =
        document.getElementById("scheduleList");

      list.innerHTML = "Memuat jadwal...";

      try {

        const snapshot =
          await db.collection("train_schedules")
          .orderBy("departure")
          .get();

        if (snapshot.empty) {

          list.innerHTML =
            '<div class="empty">Belum ada jadwal.</div>';

          return;
        }

        list.innerHTML = "";

        snapshot.forEach(function(doc) {

          const data = doc.data();

          const schedule =
            document.createElement("div");

          schedule.className = "schedule";

          schedule.innerHTML = `

            <div class="schedule-header">

              <div>

                <h3>
                  ${escapeHtml(data.trainName || "-")}
                </h3>

                <p>
                  No. Kereta:
                  ${escapeHtml(data.trainNumber || "-")}
                </p>

              </div>

              <div>

                <span class="status ${
                  data.active === false ? "inactive" : ""
                }">

                  ${
                    data.active === false
                    ? "Tidak Aktif"
                    : escapeHtml(data.status || "Beroperasi")
                  }

                </span>

              </div>

            </div>

            <p>
              🕐 ${escapeHtml(data.departure || "-")}
              →
              ${escapeHtml(data.arrival || "-")}
            </p>

            <p>
              📍 Tujuan:
              ${escapeHtml(data.destination || "-")}
            </p>

            <div class="actions">

              <button
                class="primary"
                onclick="editSchedule('${doc.id}')">
                Edit
              </button>

              <button
                class="danger"
                onclick="deleteSchedule('${doc.id}')">
                Hapus
              </button>

            </div>

          `;

          list.appendChild(schedule);

        });

      } catch (error) {

        console.error(error);

        list.innerHTML =
          "<p>Gagal memuat jadwal.</p>";

      }

    }

    function showAddForm() {

      editingId = null;

      document.getElementById("formTitle").textContent =
        "Tambah Jadwal";

      document.getElementById("scheduleForm").reset();

      document.getElementById("active").value = "true";

      document.getElementById("status").value =
        "Beroperasi";

      document.getElementById("formCard").style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

    function hideForm() {

      editingId = null;

      document.getElementById("formCard").style.display =
        "none";

      document.getElementById("scheduleForm").reset();

    }

    document
      .getElementById("scheduleForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = {

          trainName:
            document.getElementById("trainName").value.trim(),

          trainNumber:
            document.getElementById("trainNumber").value.trim(),

          destination:
            document.getElementById("destination").value.trim(),

          departure:
            document.getElementById("departure").value,

          arrival:
            document.getElementById("arrival").value,

          status:
            document.getElementById("status").value,

          active:
            document.getElementById("active").value === "true"

        };

        try {

          if (editingId) {

            await db
              .collection("train_schedules")
              .doc(editingId)
              .update(data);

            alert("Jadwal berhasil diperbarui.");

          } else {

            await db
              .collection("train_schedules")
              .add(data);

            alert("Jadwal berhasil ditambahkan.");

          }

          hideForm();

          loadSchedules();

        } catch (error) {

          console.error(error);

          alert(
            "Gagal menyimpan jadwal: " +
            error.message
          );

        }

      });

    async function editSchedule(id) {

      try {

        const doc =
          await db.collection("train_schedules")
          .doc(id)
          .get();

        if (!doc.exists) {

          alert("Data jadwal tidak ditemukan.");

          return;
        }

        const data = doc.data();

        editingId = id;

        document.getElementById("formTitle").textContent =
          "Edit Jadwal";

        document.getElementById("trainName").value =
          data.trainName || "";

        document.getElementById("trainNumber").value =
          data.trainNumber || "";

        document.getElementById("destination").value =
          data.destination || "";

        document.getElementById("departure").value =
          data.departure || "";

        document.getElementById("arrival").value =
          data.arrival || "";

        document.getElementById("status").value =
          data.status || "Beroperasi";

        document.getElementById("active").value =
          data.active === false ? "false" : "true";

        document.getElementById("formCard").style.display =
          "block";

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      } catch (error) {

        console.error(error);

        alert("Gagal mengambil data jadwal.");

      }

    }

    async function deleteSchedule(id) {

      const confirmed =
        confirm(
          "Apakah Anda yakin ingin menghapus jadwal ini?"
        );

      if (!confirmed) return;

      try {

        await db
          .collection("train_schedules")
          .doc(id)
          .delete();

        alert("Jadwal berhasil dihapus.");

        loadSchedules();

      } catch (error) {

        console.error(error);

        alert(
          "Gagal menghapus jadwal: " +
          error.message
        );

      }

    }

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
