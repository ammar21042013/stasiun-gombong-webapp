<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelola Dokumen - Admin | Stasiun Gombong</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
.header{background:#1464f4;color:#fff;padding:18px 20px}.header-content,.container{max-width:1100px;margin:auto}
.header h1{margin:0;font-size:22px}.header p{margin:5px 0 0;opacity:.9;font-size:14px}.container{padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:bold}.primary{background:#1464f4;color:#fff}.secondary{background:#e9edf2;color:#222}.danger{background:#d93025;color:#fff}
button:disabled{opacity:.6}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
#formCard,#page{display:none}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
label{display:block;font-weight:bold;margin-bottom:7px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.form-actions,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.document{border:1px solid #e1e5e9;border-radius:14px;padding:16px;margin-bottom:12px}.document-header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.document h3{margin:0 0 6px}.document p{margin:5px 0;color:#666;line-height:1.5}.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;background:#e7f7ed;color:#16743a}.inactive{background:#ffe8e8;color:#b00020}
.loading,.empty{text-align:center;padding:40px;color:#777}.notice{background:#eef5ff;color:#174a9c;border-radius:10px;padding:12px;margin-bottom:18px;font-size:14px;line-height:1.5}
.hint{font-size:13px;color:#666;margin-top:6px;word-break:break-all}.preview{margin-top:8px;padding:8px;background:#f7f8fa;border-radius:8px;font-size:13px;word-break:break-all}
@media(max-width:600px){.container{padding:15px}.actions button,.form-actions button{width:100%}}
</style>
</head>
<body>
<div id="loading" class="loading">Memeriksa akses admin...</div>
<div id="page">
<header class="header"><div class="header-content"><h1>Kelola Dokumen</h1><p>Stasiun Kelas 1 Gombong</p></div></header>
<main class="container">
<div class="topbar">
<button class="secondary" onclick="location.href='admin.html'">← Dashboard</button>
<button class="primary" onclick="showAddForm()">+ Tambah Dokumen</button>
</div>
<div id="formCard" class="card">
<h2 id="formTitle">Tambah Dokumen</h2>
<div class="notice"><b>Mode gratis:</b> dokumen disimpan sebagai link. Tidak menggunakan Firebase Storage.</div>
<form id="documentForm">
<div class="form-grid">
<div><label>Judul Dokumen</label><input id="title" required placeholder="Contoh: Profil Stasiun Gombong"></div>
<div><label>Kategori</label><select id="category"><option>Umum</option><option>Profil</option><option>Jadwal</option><option>Peraturan</option><option>Informasi</option><option>Lainnya</option></select></div>
<div class="full"><label>Keterangan</label><textarea id="description" placeholder="Keterangan singkat dokumen"></textarea></div>
<div class="full"><label>Link Dokumen</label><input id="url" type="url" required placeholder="https://..."><div class="hint">Gunakan link Google Drive, PDF, OneDrive, atau URL lain yang dapat dibuka pengunjung.</div><div id="preview" class="preview" style="display:none"></div></div>
<div><label>Aktif</label><select id="active"><option value="true">Ya</option><option value="false">Tidak</option></select></div>
</div>
<div class="form-actions"><button id="save" class="primary" type="submit">Simpan</button><button class="secondary" type="button" onclick="hideForm()">Batal</button></div>
</form>
</div>
<div class="card"><h2>Daftar Dokumen</h2><div id="list">Memuat dokumen...</div></div>
</main></div>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let editingId=null;
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function safe(v){try{let u=new URL(v);return u.protocol==="http:"||u.protocol==="https:"}catch(e){return false}}
auth.onAuthStateChanged(async u=>{if(!u){location.href="admin-login.html";return}try{let a=await db.collection("admins").doc(u.uid).get();if(!a.exists||a.data().role!=="admin"){await auth.signOut();location.href="admin-login.html";return}loading.style.display="none";page.style.display="block";load()}catch(e){console.error(e);await auth.signOut();location.href="admin-login.html"}});
async function load(){let l=document.getElementById("list");l.textContent="Memuat dokumen...";try{let s=await db.collection("documents").get();if(s.empty){l.innerHTML='<div class="empty">Belum ada dokumen.</div>';return}let a=[];s.forEach(d=>a.push({id:d.id,d:d.data()}));a.sort((x,y)=>String(x.d.title||"").localeCompare(String(y.d.title||""),"id"));l.innerHTML="";a.forEach(x=>{let d=x.d,e=document.createElement("div");e.className="document";e.innerHTML=`<div class="document-header"><div><h3>${esc(d.title||"-")}</h3><p><b>Kategori:</b> ${esc(d.category||"Umum")}</p></div><span class="status ${d.active===false?"inactive":""}">${d.active===false?"Tidak Aktif":"Aktif"}</span></div><p>${esc(d.description||"Tidak ada keterangan.")}</p><p class="hint">${esc(d.url||"-")}</p><div class="actions">${d.url?`<button class="primary" onclick="openDoc('${x.id}')">Buka</button>`:""}<button class="secondary" onclick="edit('${x.id}')">Edit</button><button class="danger" onclick="del('${x.id}')">Hapus</button></div>`;l.appendChild(e)})}catch(e){l.innerHTML="<p>Gagal memuat: "+esc(e.message)+"</p>"}}
function showAddForm(){editingId=null;formTitle.textContent="Tambah Dokumen";documentForm.reset();active.value="true";preview.style.display="none";formCard.style.display="block";scrollTo({top:0,behavior:"smooth"})}
function hideForm(){editingId=null;formCard.style.display="none";documentForm.reset();preview.style.display="none"}
url.oninput=()=>{let v=url.value.trim();preview.style.display=v?"block":"none";preview.textContent=safe(v)?"✓ Link valid: "+v:"⚠ Gunakan link http:// atau https://"};
documentForm.onsubmit=async e=>{e.preventDefault();let u=url.value.trim();if(!title.value.trim())return alert("Judul wajib diisi.");if(!safe(u))return alert("Link tidak valid.");save.disabled=true;save.textContent="Menyimpan...";let data={title:title.value.trim(),category:category.value,description:description.value.trim(),url:u,active:active.value==="true",updatedAt:firebase.firestore.FieldValue.serverTimestamp()};try{if(editingId)await db.collection("documents").doc(editingId).update(data);else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection("documents").add(data)}alert(editingId?"Dokumen berhasil diperbarui.":"Dokumen berhasil ditambahkan.");hideForm();await load()}catch(e){alert("Gagal menyimpan: "+e.message)}finally{save.disabled=false;save.textContent="Simpan"}};
async function edit(id){let d=await db.collection("documents").doc(id).get();if(!d.exists)return alert("Dokumen tidak ditemukan.");let x=d.data();editingId=id;formTitle.textContent="Edit Dokumen";title.value=x.title||"";category.value=x.category||"Umum";description.value=x.description||"";url.value=x.url||"";active.value=x.active===false?"false":"true";formCard.style.display="block";scrollTo({top:0,behavior:"smooth"})}
async function openDoc(id){let d=await db.collection("documents").doc(id).get();if(!d.exists)return alert("Dokumen tidak ditemukan.");let u=d.data().url;if(!safe(u))return alert("Link tidak valid.");window.open(u,"_blank","noopener,noreferrer")}
async function del(id){if(!confirm("Hapus dokumen ini?"))return;try{await db.collection("documents").doc(id).delete();alert("Dokumen berhasil dihapus.");load()}catch(e){alert("Gagal menghapus: "+e.message)}}
</script>
</body>
</html>
