<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil Stasiun - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    /* HEADER */
    .header {
      background: #1464f4;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 900px;
      margin: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    /* CONTAINER */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    /* TOPBAR */
    .topbar {
      margin-bottom: 20px;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
    }

    /* FORM */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #1464f4;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* BUTTON */
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .primary {
      background: #1464f4;
      color: white;
    }

    .secondary {
      background: #e9edf2;
      color: #222;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 50px;
    }

    #page {
      display: none;
    }

    /* MESSAGE */
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #e7f7ed;
      color: #16743a;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

    }
  </style>
</head>

<body>


  <!-- LOADING -->
  <div id="loading" class="loading">
    Memeriksa akses admin...
  </div>


  <!-- HALAMAN ADMIN -->
  <div id="page">


    <!-- HEADER -->
    <header class="header">

      <div class="header-content">

        <h1>
          Profil Stasiun
        </h1>

        <p>
          Stasiun Kelas 1 Gombong
        </p>

      </div>

    </header>


    <!-- CONTENT -->
    <main class="container">


      <!-- TOMBOL KEMBALI -->
      <div class="topbar">

        <button
          type="button"
          class="secondary"
          onclick="window.location.href='admin.html'">

          ← Kembali ke Dashboard

        </button>

      </div>


      <!-- FORM CARD -->
      <div class="card">

        <h2>
          Informasi Stasiun
        </h2>

        <p>
          Kelola informasi Profil Stasiun Gombong.
        </p>


        <!-- FORM -->
        <form id="profileForm">


          <div class="form-grid">


            <!-- 1. NAMA STASIUN -->
            <div>

              <label for="name">
                Nama Stasiun
              </label>

              <input
                id="name"
                name="name"
                type="text"
                placeholder="Contoh: Stasiun Gombong"
                required>

            </div>


            <!-- 2. KELAS STASIUN -->
            <div>

              <label for="stationClass">
                Kelas Stasiun
              </label>

              <input
                id="stationClass"
                name="stationClass"
                type="text"
                placeholder="Contoh: Kelas 1"
                required>

            </div>


            <!-- 3. KODE STASIUN -->
            <div>

              <label for="code">
                Kode Stasiun
              </label>

              <input
                id="code"
                name="code"
                type="text"
                placeholder="Contoh: GOM"
                required>

            </div>


            <!-- 4. JAM OPERASIONAL -->
            <div>

              <label for="operatingHours">
                Jam Operasional
              </label>

              <input
                id="operatingHours"
                name="operatingHours"
                type="text"
                placeholder="Contoh: 24 Jam">

            </div>


            <!-- 5. ALAMAT -->
            <div class="full">

              <label for="address">
                Alamat
              </label>

              <textarea
                id="address"
                name="address"
                placeholder="Masukkan alamat lengkap stasiun"
                required></textarea>

            </div>


            <!-- 6. DESKRIPSI -->
            <div class="full">

              <label for="description">
                Deskripsi
              </label>

              <textarea
                id="description"
                name="description"
                placeholder="Masukkan deskripsi Stasiun Gombong"
                required></textarea>

            </div>


            <!-- 7. NOMOR TELEPON -->
            <div>

              <label for="phone">
                Nomor Telepon
              </label>

              <input
                id="phone"
                name="phone"
                type="text"
                placeholder="Contoh: 0287xxxxxxx">

            </div>


          </div>


          <!-- ACTION BUTTON -->
          <div class="actions">

            <button
              type="submit"
              class="primary">

              💾 Simpan Perubahan

            </button>


            <button
              type="button"
              class="secondary"
              onclick="loadProfile()">

              🔄 Muat Ulang

            </button>

          </div>


          <!-- MESSAGE -->
          <div
            id="message"
            class="message">
          </div>


        </form>

      </div>

    </main>

  </div>


  <!-- FIREBASE CONFIG -->
  <script src="firebase-config.js"></script>


  <!-- FIREBASE APP -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>


  <!-- FIREBASE AUTH -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


  <!-- FIREBASE FIRESTORE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>


    /*
     * ==============================
     * FIREBASE
     * ==============================
     */

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    /*
     * ==============================
     * CEK LOGIN ADMIN
     * ==============================
     */

    auth.onAuthStateChanged(
      async function(user) {

        /*
         * Jika belum login
         */

        if (!user) {

          window.location.href =
            "admin-login.html";

          return;

        }


        try {

          /*
           * Ambil data admin
           */

          const adminDoc =
            await db
              .collection("admins")
              .doc(user.uid)
              .get();


          /*
           * Pastikan admin terdaftar
           */

          if (!adminDoc.exists) {

            await auth.signOut();

            window.location.href =
              "admin-login.html";

            return;

          }


          /*
           * Ambil role
           */

          const adminData =
            adminDoc.data();


          /*
           * Pastikan role admin
           */

          if (
            adminData.role !== "admin"
          ) {

            await auth.signOut();

            window.location.href =
              "admin-login.html";

            return;

          }


          /*
           * Tampilkan halaman
           */

          document.getElementById(
            "loading"
          ).style.display = "none";


          document.getElementById(
            "page"
          ).style.display = "block";


          /*
           * Muat data profil
           */

          loadProfile();


        } catch (error) {

          console.error(error);

          await auth.signOut();

          window.location.href =
            "admin-login.html";

        }

      }
    );


    /*
     * ==============================
     * LOAD PROFILE
     * ==============================
     */

    async function loadProfile() {

      try {

        /*
         * Bersihkan pesan
         */

        showMessage("", "");


        /*
         * Ambil document main
         */

        const profileDoc =
          await db
            .collection("station_profile")
            .doc("main")
            .get();


        /*
         * Jika tidak ditemukan
         */

        if (!profileDoc.exists) {

          showMessage(
            "Data profil stasiun belum ditemukan.",
            "error"
          );

          return;

        }


        /*
         * Ambil data
         */

        const data =
          profileDoc.data();


        /*
         * NAMA STASIUN
         */

        document.getElementById(
          "name"
        ).value =
          data.name || "";


        /*
         * KELAS STASIUN
         */

        document.getElementById(
          "stationClass"
        ).value =
          data.class || "";


        /*
         * KODE STASIUN
         */

        document.getElementById(
          "code"
        ).value =
          data.code || "";


        /*
         * ALAMAT
         */

        document.getElementById(
          "address"
        ).value =
          data.address || "";


        /*
         * DESKRIPSI
         */

        document.getElementById(
          "description"
        ).value =
          data.description || "";


        /*
         * JAM OPERASIONAL
         */

        document.getElementById(
          "operatingHours"
        ).value =
          data.operatingHours || "";


        /*
         * NOMOR TELEPON
         */

        document.getElementById(
          "phone"
        ).value =
          data.phone || "";


      } catch (error) {

        console.error(error);

        showMessage(
          "Gagal memuat profil: " +
          error.message,
          "error"
        );

      }

    }


    /*
     * ==============================
     * SIMPAN PROFILE
     * ==============================
     */

    document
      .getElementById("profileForm")
      .addEventListener(
        "submit",
        async function(event) {

          /*
           * Jangan reload halaman
           */

          event.preventDefault();


          /*
           * Ambil data formulir
           */

          const data = {

            name:
              document
                .getElementById("name")
                .value
                .trim(),

            class:
              document
                .getElementById("stationClass")
                .value
                .trim(),

            code:
              document
                .getElementById("code")
                .value
                .trim(),

            address:
              document
                .getElementById("address")
                .value
                .trim(),

            description:
              document
                .getElementById("description")
                .value
                .trim(),

            operatingHours:
              document
                .getElementById("operatingHours")
                .value
                .trim(),

            phone:
              document
                .getElementById("phone")
                .value
                .trim()

          };


          try {

            /*
             * Simpan ke Firestore
             *
             * station_profile
             *       ↓
             *      main
             */

            await db
              .collection("station_profile")
              .doc("main")
              .set(
                data,
                {
                  merge: true
                }
              );


            /*
             * Tampilkan pesan berhasil
             */

            showMessage(
              "Profil stasiun berhasil diperbarui.",
              "success"
            );


          } catch (error) {

            console.error(error);

            showMessage(
              "Gagal menyimpan profil: " +
              error.message,
              "error"
            );

          }

        }
      );


    /*
     * ==============================
     * PESAN
     * ==============================
     */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      /*
       * Jika kosong
       */

      if (!text) {

        message.style.display =
          "none";

        message.textContent =
          "";

        return;

      }


      /*
       * Isi pesan
       */

      message.textContent =
        text;


      /*
       * Atur class
       */

      message.className =
        "message " + type;


      /*
       * Tampilkan
       */

      message.style.display =
        "block";

    }


  </script>

</body>
</html>
