<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil Stasiun - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #1464f4;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 900px;
      margin: auto;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #1464f4;
      color: white;
    }

    .secondary {
      background: #e9edf2;
      color: #222;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .loading {
      text-align: center;
      padding: 50px;
    }

    #page {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #e7f7ed;
      color: #16743a;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    Memeriksa akses admin...
  </div>


  <div id="page">

    <header class="header">

      <div class="header-content">

        <h1>
          Profil Stasiun
        </h1>

        <p>
          Stasiun Kelas 1 Gombong
        </p>

      </div>

    </header>


    <main class="container">

      <div class="topbar">

        <button
          class="secondary"
          onclick="window.location.href='admin.html'">

          ← Kembali ke Dashboard

        </button>

      </div>


      <div class="card">

        <h2>
          Informasi Stasiun
        </h2>

        <p>
          Ubah informasi profil stasiun melalui formulir berikut.
        </p>


        <form id="profileForm">

          <div class="form-grid">


            <!-- NAMA -->
            <div>

              <label for="name">
                Nama Stasiun
              </label>

              <input
                id="name"
                type="text"
                required>

            </div>


            <!-- KELAS -->
            <div>

              <label for="stationClass">
                Kelas Stasiun
              </label>

              <input
                id="stationClass"
                type="text"
                required>

            </div>


            <!-- KODE -->
            <div>

              <label for="code">
                Kode Stasiun
              </label>

              <input
                id="code"
                type="text"
                required>

            </div>


            <!-- JAM -->
            <div>

              <label for="operatingHours">
                Jam Operasional
              </label>

              <input
                id="operatingHours"
                type="text">

            </div>


            <!-- ALAMAT -->
            <div class="full">

              <label for="address">
                Alamat
              </label>

              <textarea
                id="address"
                required></textarea>

            </div>


            <!-- DESKRIPSI -->
            <div class="full">

              <label for="description">
                Deskripsi
              </label>

              <textarea
                id="description"
                required></textarea>

            </div>


            <!-- TELEPON -->
            <div>

              <label for="phone">
                Nomor Telepon
              </label>

              <input
                id="phone"
                type="text">

            </div>


          </div>


          <div class="actions">

            <button
              type="submit"
              class="primary">

              💾 Simpan Perubahan

            </button>


            <button
              type="button"
              class="secondary"
              onclick="loadProfile()">

              🔄 Muat Ulang

            </button>

          </div>


          <div
            id="message"
            class="message">
          </div>

        </form>

      </div>

    </main>

  </div>


  <!-- FIREBASE CONFIG -->
  <script src="firebase-config.js"></script>


  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>

    /*
     * FIREBASE
     */

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    /*
     * CEK ADMIN
     */

    auth.onAuthStateChanged(async function(user) {

      if (!user) {

        window.location.href =
          "admin-login.html";

        return;

      }


      try {

        const adminDoc =
          await db
            .collection("admins")
            .doc(user.uid)
            .get();


        if (
          !adminDoc.exists ||
          adminDoc.data().role !== "admin"
        ) {

          await auth.signOut();

          window.location.href =
            "admin-login.html";

          return;

        }


        document.getElementById(
          "loading"
        ).style.display = "none";


        document.getElementById(
          "page"
        ).style.display = "block";


        loadProfile();


      } catch (error) {

        console.error(error);

        await auth.signOut();

        window.location.href =
          "admin-login.html";

      }

    });


    /*
     * LOAD PROFIL
     */

    async function loadProfile() {

      try {

        showMessage("", "");


        const doc =
          await db
            .collection("station_profile")
            .doc("main")
            .get();


        if (!doc.exists) {

          showMessage(
            "Data profil belum ditemukan.",
            "error"
          );

          return;

        }


        const data =
          doc.data();


        document.getElementById(
          "name"
        ).value =
          data.name || "";


        document.getElementById(
          "stationClass"
        ).value =
          data.class || "";


        document.getElementById(
          "code"
        ).value =
          data.code || "";


        document.getElementById(
          "address"
        ).value =
          data.address || "";


        document.getElementById(
          "description"
        ).value =
          data.description || "";


        document.getElementById(
          "operatingHours"
        ).value =
          data.operatingHours || "";


        document.getElementById(
          "phone"
        ).value =
          data.phone || "";


      } catch (error) {

        console.error(error);

        showMessage(
          "Gagal memuat profil: " +
          error.message,
          "error"
        );

      }

    }


    /*
     * SIMPAN PROFIL
     */

    document
      .getElementById("profileForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const data = {

            name:
              document
                .getElementById("name")
                .value
                .trim(),

            class:
              document
                .getElementById("stationClass")
                .value
                .trim(),

            code:
              document
                .getElementById("code")
                .value
                .trim(),

            address:
              document
                .getElementById("address")
                .value
                .trim(),

            description:
              document
                .getElementById("description")
                .value
                .trim(),

            operatingHours:
              document
                .getElementById("operatingHours")
                .value
                .trim(),

            phone:
              document
                .getElementById("phone")
                .value
                .trim()

          };


          try {

            await db
              .collection("station_profile")
              .doc("main")
              .set(
                data,
                { merge: true }
              );


            showMessage(
              "Profil stasiun berhasil diperbarui.",
              "success"
            );


          } catch (error) {

            console.error(error);

            showMessage(
              "Gagal menyimpan profil: " +
              error.message,
              "error"
            );

          }

        }
      );


    /*
     * PESAN
     */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      if (!text) {

        message.style.display =
          "none";

        return;

      }


      message.textContent =
        text;


      message.className =
        "message " + type;


      message.style.display =
        "block";

    }

  </script>

</body>
</html>
